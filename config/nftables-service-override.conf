# Deployed to /etc/systemd/system/nftables.service.d/override.conf
#
# WHY THIS EXISTS. Debian's nftables.service ships:
#
#     ExecStop=/usr/sbin/nft flush ruleset
#
# That flushes the WHOLE kernel ruleset, not just this unit's tables. Docker
# keeps its DNAT and filter rules in the same ruleset via iptables-nft, so a
# plain `systemctl stop nftables` — or `restart`, which is a stop then a start —
# silently deletes every published container port (8082, 8083, 9091, 3552,
# 51413). They do not come back on the following start, because only the Docker
# daemon can rebuild them; you would have to restart docker.service to recover,
# and the symptom (containers healthy, ports dead) points nowhere near nftables.
#
# The empty ExecStop= line is required: systemd APPENDS to list-type directives,
# so without it the stock flush would still run before ours.
[Service]
ExecStop=
ExecStop=/usr/sbin/nft destroy table inet lanfw
