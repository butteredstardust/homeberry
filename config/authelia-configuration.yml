# yaml-language-server: $schema=https://www.authelia.com/schemas/v4.39/json-schema/configuration.json
# Authelia v4.39 configuration. Site-specific names are rendered in memory by
# the stable Go-template filter; the repository copy remains safe to publish.

server:
  address: 'tcp://0.0.0.0:9091/'
  endpoints:
    authz:
      forward-auth:
        implementation: 'ForwardAuth'
        # ⚠ COOKIE SESSION ONLY, DELIBERATELY — DO NOT ADD THE HEADER STRATEGIES.
        # Authelia's default strategy list for this endpoint also includes
        # HeaderAuthorization / HeaderProxyAuthorization, which make it CONSUME
        # any `Authorization: Basic` header the browser sends and treat it as a
        # login attempt against Authelia's own user database.
        #
        # That breaks every backend behind this proxy that has its own HTTP
        # Basic auth — here, Transmission. The browser gets Transmission's 401,
        # prompts, and then sends those credentials on EVERY subsequent request;
        # Caddy copies them into the authz subrequest; Authelia claims them,
        # and because these vhosts are `two_factor` a Basic header can only ever
        # satisfy ONE factor. So Authelia answers 401 with its own
        # `WWW-Authenticate: Basic realm="Authorization Required"`, the user sees
        # a password box that NO password can satisfy, and it bounces back to the
        # portal. Found 2026-09-02, in exactly that shape.
        #
        # Restricting the endpoint to CookieSession makes Authelia authenticate
        # from its session cookie alone and pass `Authorization` through
        # untouched, so Transmission's own login works behind the portal and the
        # two tiers stay independent — which is the posture the rest of this
        # stack is built on.
        authn_strategies:
          - name: 'CookieSession'

log:
  level: 'info'

totp:
  issuer: '{{ env "CADDY_DOMAIN" }}'
  algorithm: 'SHA1'
  digits: 6
  period: 30
  skew: 1
  secret_size: 32

identity_validation:
  reset_password:
    # Set by AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET. Keeping
    # secret values out of this file also keeps rendered debug output clean.
    jwt_secret: ''

authentication_backend:
  file:
    path: '/var/lib/authelia/users_database.yml'
    watch: false
    password:
      algorithm: 'argon2'
      argon2:
        variant: 'argon2id'
        iterations: 3
        memory: 65536
        parallelism: 4
        key_length: 32
        salt_length: 16

access_control:
  default_policy: 'deny'
  rules:
    - domain:
        - 'auth.{{ env "CADDY_DOMAIN" }}'
        - 'home.{{ env "CADDY_DOMAIN" }}'
        - 'paste.{{ env "CADDY_DOMAIN" }}'
      policy: 'bypass'
    - domain:
        - 'pihole.{{ env "CADDY_DOMAIN" }}'
        - 'files.{{ env "CADDY_DOMAIN" }}'
        - 'torrents.{{ env "CADDY_DOMAIN" }}'
        - 'docker.{{ env "CADDY_DOMAIN" }}'
        - 'homebridge.{{ env "CADDY_DOMAIN" }}'
        - 'logs.{{ env "CADDY_DOMAIN" }}'
        - 'metrics.{{ env "CADDY_DOMAIN" }}'
      policy: 'two_factor'

session:
  # Set by AUTHELIA_SESSION_SECRET. The memory provider is the default when no
  # redis section exists; a reboot therefore invalidates sessions by design.
  secret: ''
  cookies:
    - domain: '{{ env "CADDY_DOMAIN" }}'
      authelia_url: 'https://auth.{{ env "CADDY_DOMAIN" }}'
      default_redirection_url: 'https://home.{{ env "CADDY_DOMAIN" }}'
      same_site: 'lax'
      inactivity: '5 minutes'
      expiration: '1 hour'
      remember_me: '1 month'

storage:
  # Set by AUTHELIA_STORAGE_ENCRYPTION_KEY. Never rotate the value in .env
  # without using Authelia's storage encryption change-key command first.
  encryption_key: ''
  local:
    path: '/var/lib/authelia/db.sqlite3'

notifier:
  filesystem:
    filename: '/var/lib/authelia/notification.txt'
